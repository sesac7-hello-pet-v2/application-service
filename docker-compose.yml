version: '3.8'
name: application-service
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: db-application
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-application-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
volumes:
  db-application-data: { }
